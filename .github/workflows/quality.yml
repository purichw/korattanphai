name: Quality Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only used in the isolated build exercised by Playwright network mocks.
      VITE_SUPABASE_URL: https://ktp-auth-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:database
      - run: npm run build:protected
      - run: git diff --exit-code -- src/data/generated/
      - run: npm run test:e2e:built
      - run: npm run test:e2e:database
      - run: npm run build:protected
        env:
          VITE_DATA_BACKEND: supabase
          BUILD_OUT_DIR: tmp-snapshots/ci-database-build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: regression-failures
          path: test-results/
          retention-days: 7
